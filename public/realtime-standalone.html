<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Live Data - Supply Chain Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(90deg, #0f3460 0%, #533483 100%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            padding: 20px 0;
            border-bottom: 3px solid #e94560;
        }

        .navbar-brand {
            font-size: 28px;
            font-weight: 800;
            color: white !important;
            letter-spacing: 1px;
        }

        .navbar-text {
            color: rgba(255, 255, 255, 0.8) !important;
            font-size: 14px;
        }

        .nav-menu {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-left: auto;
            align-items: center;
        }

        .nav-link {
            color: white !important;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.1);
            font-size: 13px;
            font-weight: 600;
        }

        .nav-link:hover {
            background: rgba(233, 69, 96, 0.3);
            transform: translateY(-2px);
        }

        .nav-link.active {
            background: #e94560;
            border: 2px solid #e94560;
        }

        .container-main {
            padding: 40px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 50px;
            color: white;
        }

        .page-header h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
        }

        .page-header p {
            font-size: 16px;
            opacity: 0.9;
            letter-spacing: 0.5px;
        }

        .status-live {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(233, 69, 96, 0.2);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid #e94560;
            color: #e94560;
            font-weight: 600;
            font-size: 13px;
            margin-top: 15px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #e94560;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .footer {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 50px;
        }

        .footer p {
            margin: 0;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center w-100">
                <div>
                    <div class="navbar-brand">
                        <i class="bi bi-lightning-fill"></i> REAL-TIME DATA
                    </div>
                    <div class="navbar-text">Global Supply Chain Intelligence Platform</div>
                </div>
                
                <!-- Menu Navigation -->
                <div class="nav-menu">
                    <a href="dashboard-complete.html" class="nav-link">
                        <i class="bi bi-speedometer2"></i> Risk Dashboard
                    </a>
                    <a href="dashboard-integrated.html" class="nav-link">
                        <i class="bi bi-diagram-3"></i> Integrated
                    </a>
                    <a href="realtime-data.html" class="nav-link">
                        <i class="bi bi-graph-up"></i> Premium
                    </a>
                    <a href="realtime-standalone.html" class="nav-link active">
                        <i class="bi bi-lightning-charge"></i> Live Data
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container-main">
        <!-- Page Header -->
        <div class="page-header">
            <h1>Real-Time Live Data</h1>
            <p>Global weather, exchange rates, and port monitoring in real-time</p>
            <div class="status-live">
                <span class="status-dot"></span>
                Streaming Live Data
            </div>
        </div>

        <!-- Embed Real-Time Section -->
        <div style="background: white; border-radius: 16px; padding: 30px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);">
            <iframe src="realtime-section.html" style="width: 100%; border: none; background: transparent; height: auto;" frameborder="0" scrolling="no"></iframe>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>📡 Connected to Live APIs | 🌍 Real-Time Global Data | ⏱️ Last update: <span id="footerTime">--:--:--</span></p>
    </div>

    <script>
        // Update footer time
        function updateFooterTime() {
            document.getElementById('footerTime').textContent = new Date().toLocaleTimeString();
        }
        updateFooterTime();
        setInterval(updateFooterTime, 1000);
    </script>
</body>
</html>
